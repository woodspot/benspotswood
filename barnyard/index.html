<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6cc2f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Barnyard" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Barnyard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/barnyard/icon-180.png" />
  <link rel="manifest" href="/barnyard/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/barn/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="hills" aria-hidden="true"></div>

  <section id="menu" class="menu">
    <a class="back" href="/kids/" aria-label="Back to the games">⬅</a>
    <button id="gear" class="gear" aria-label="Grown-ups: settings">⚙️</button>
    <h1>Barn<span>yard</span></h1>
    <div class="modes" id="modes">
      <button class="mode m-peek" data-mode="peek">
        <span class="pic"><span class="mini-barn"></span><span class="peeker">🐮</span></span>
        <span class="lbl">Peek!</span>
      </button>
      <button class="mode m-quiz" data-mode="quiz">
        <span class="pic"><span class="bubble">Moo?</span><span class="peeker">🐷</span></span>
        <span class="lbl">Who says?</span>
      </button>
    </div>
    <div id="grown" class="grown" hidden>
      <div class="grown-box" role="dialog" aria-label="Settings">
        <p class="gate-title">Settings</p>
        <div class="settings"><div class="lang" id="lang"></div><button id="voice" class="voice-btn"></button></div>
        <a class="grown-link" href="/">All games (grown-ups) →</a>
        <p class="tip">Kids can tap ⬅ to pick another game. For a full lock, use Guided Access.</p>
        <p class="tip">Real animal sounds from BigSoundBank (CC0), a lion roar by Growcott et al. (CC BY 4.0), and pig, mouse and turkey made with ElevenLabs. <a href="/sounds/CREDITS.txt">Sound credits</a></p>
        <button class="grown-done">Done</button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div id="stage" class="stage"></div>
    <button id="home" class="home" aria-label="Back">⬅</button>
    <button id="ask" class="ask" aria-label="Hear it again" hidden></button>
    <div id="party" class="party" hidden><div class="big-star">⭐</div></div>
  </section>

  <script type="module" src="/src/barn/main.ts"></script>
</body>
</html>
