<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5aa9f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Balloon Pop" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Balloon Pop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/balloons/icon-180.png" />
  <link rel="manifest" href="/balloons/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/balloons/style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="shade" cx="35%" cy="30%" r="75%">
        <stop offset="55%" stop-color="#000" stop-opacity="0" />
        <stop offset="100%" stop-color="#000" stop-opacity=".28" />
      </radialGradient>
    </defs>
  </svg>

  <div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

  <section id="menu" class="menu">
    <a class="back" href="/kids/" aria-label="Back to the games">⬅</a>
    <button id="gear" class="gear" aria-label="Grown-ups: settings">⚙️</button>
    <h1>Balloon <span>Pop!</span></h1>
    <div class="modes" id="modes"></div>
    <div id="grown" class="grown" hidden>
      <div class="grown-box" role="dialog" aria-label="Settings">
        <p class="gate-title">Settings</p>
        <div class="settings"><div class="lang" id="lang"></div><button id="voice" class="voice-btn"></button></div>
        <a class="grown-link" href="/">All games (grown-ups) →</a>
        <p class="tip">Kids can tap ⬅ to pick another game. For a full lock, use Guided Access.</p>
        <button class="grown-done">Done</button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div id="stage" class="stage"></div>
    <button id="home" class="home" aria-label="Back">⬅</button>
    <button id="target" class="target" aria-label="Hear it again" hidden></button>
    <div id="party" class="party" hidden><div class="big-star">⭐</div></div>
  </section>

  <script type="module" src="/src/balloons/main.ts"></script>
</body>
</html>
