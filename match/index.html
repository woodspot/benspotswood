<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5aa9f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Match It" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Match It!</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/match/icon-180.png" />
  <link rel="manifest" href="/match/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/match/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

  <section id="menu" class="menu">
    <a class="back" href="/kids/" aria-label="Back to the games">⬅</a>
    <button id="gear" class="gear" aria-label="Grown-ups: settings">⚙️</button>
    <h1>Match <span>It!</span></h1>
    <div class="themes" id="themes"></div>
    <div class="modes" id="modes">
      <button class="mode m-same" data-mode="same">
        <span class="pic"><span class="mini-card">🐶</span><span class="mini-card">🐶</span></span>
        <span class="lbl">Same</span>
      </button>
      <button class="mode m-memory" data-mode="memory">
        <span class="pic"><span class="mini-card cover"></span><span class="mini-card">🐱</span><span class="mini-card cover"></span></span>
        <span class="lbl">Memory</span>
      </button>
    </div>
    <div class="pairs" id="pairs"></div>
    <div id="grown" class="grown" hidden>
      <div class="grown-box" role="dialog" aria-label="Settings">
        <p class="gate-title">Settings</p>
        <div class="settings"><div class="lang" id="lang"></div><button id="voice" class="voice-btn"></button></div>
        <a class="grown-link" href="/">All games (grown-ups) →</a>
        <p class="tip">Kids can tap ⬅ to pick another game. For a full lock, use Guided Access.</p>
        <button class="grown-done">Done</button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div id="stage" class="stage"></div>
    <button id="home" class="home" aria-label="Back">⬅</button>
    <div id="party" class="party" hidden><div class="big-star">⭐</div></div>
  </section>

  <script type="module" src="/src/match/main.ts"></script>
</body>
</html>
