<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3a9a5b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hoot's Trail" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hoot's Trail</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/trail/icon-180.png" />
  <link rel="manifest" href="/trail/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/trail/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

  <section id="menu" class="menu">
    <a class="back" href="/kids/" aria-label="Back to the games">⬅</a>
    <button id="gear" class="gear" aria-label="Grown-ups: settings">⚙️</button>
    <div class="hoot-hello" aria-hidden="true">🦉</div>
    <h1>Hoot's <span>Trail</span></h1>
    <div id="players" class="players"></div>
    <div id="grown" class="grown" hidden>
      <div class="grown-box" role="dialog" aria-label="Settings">
        <p class="gate-title">Settings</p>
        <div class="settings"><div class="lang" id="lang"></div><button id="voice" class="voice-btn"></button></div>
        <p class="gate-title">Players</p>
        <div id="roster" class="roster"></div>
        <a class="grown-link" href="/">All games (grown-ups) →</a>
        <p class="tip">Each player has their own trail, stars and stickers. Tap the animal to change it.
          Progress is shared with the family's other devices when family sync is on (set up in Toy Phone).</p>
        <button class="grown-done">Done</button>
      </div>
    </div>
  </section>

  <section id="trail" class="screen trail" hidden>
    <header class="bar">
      <span id="me" class="me"></span>
      <button id="book-btn" class="book-btn" aria-label="My stickers">📒</button>
    </header>
    <div id="path" class="path"></div>
  </section>

  <section id="lesson" class="screen lesson" hidden>
    <div id="progress" class="progress"></div>
    <div id="board" class="board"></div>
    <button id="hoot" class="hoot-btn" aria-label="Hear it again">🦉</button>
  </section>

  <section id="book" class="screen book" hidden>
    <h2>My stickers <small id="book-count"></small></h2>
    <div id="stickers" class="stickers"></div>
  </section>

  <div id="reward" class="reward" hidden></div>
  <div id="party" class="party" hidden><div class="big-star">⭐</div></div>
  <button id="home" class="home" aria-label="Back" hidden>⬅</button>

  <script type="module" src="/src/trail/main.ts"></script>
</body>
</html>
